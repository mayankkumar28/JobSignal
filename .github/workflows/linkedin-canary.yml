name: LinkedIn Guest DOM Canary

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build:test
      - name: Run live LinkedIn tests
        run: xvfb-run --auto-servernum npx playwright test --config tests/playwright-live.config.ts
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: canary-traces
          path: test-results/
          retention-days: 14
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 LinkedIn guest DOM canary failed',
              body: [
                'The weekly canary detected a DOM change or extension regression.',
                '',
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Check the uploaded traces in the workflow artifacts for details.',
                'Update `LINKEDIN_SELECTORS` in `src/shared/constants.ts` if LinkedIn changed its class names.',
              ].join('\n'),
              labels: ['bug', 'linkedin-dom'],
            });
